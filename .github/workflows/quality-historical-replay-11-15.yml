name: Historical Replay 11-15 Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check shadow-historical-replay-11-15.js
          node --check test-shadow-historical-replay-11-15.js
          node --check shadow-macro-intelligence-agent.js
          node --check shadow-event-risk-calendar.js
          node --check shadow-market-regime-engine-v2.js
          node --check shadow-portfolio-optimizer-v2.js
          node --check shadow-institutional-risk-engine.js
      - name: Existing critical 11-15 regressions
        run: |
          node --test test-critical-shadow-validation-11-15.js
          node --test test-critical-input-hardening-11-15.js
          node --test test-critical-shadow-fuzz-11-15.js
      - name: Historical replay contract and calibration tests
        run: node --test test-shadow-historical-replay-11-15.js
      - name: Emit replay readiness snapshot
        run: |
          node - <<'NODE'
          const {runHistoricalStyleValidation}=require('./shadow-historical-replay-11-15');
          const r=runHistoricalStyleValidation();
          console.log(JSON.stringify({status:r.status,dataClass:r.dataClass,checks:r.checks,metrics:r.metrics,safety:r.safety},null,2));
          if(r.status!=='TECHNICALLY_READY_FOR_REAL_HISTORY') process.exit(1);
          NODE
      - name: Prove production core is untouched
        shell: bash
        run: |
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            git diff --exit-code HEAD^1 HEAD^2 -- index.js package.json
          else
            git fetch origin v10.25.5-critical-fuzz-11-15 --depth=1
            git diff --exit-code FETCH_HEAD HEAD -- index.js package.json
          fi
      - name: Prove replay harness has no provider or LIVE authority
        shell: bash
        run: |
          if grep -Eqi 'api\.openai\.com|public-api\.etoro\.com|LIVE_EXECUTION_ARMED\s*=|fetch\s*\(|child_process|execSync|spawnSync' shadow-historical-replay-11-15.js; then
            echo 'Unexpected provider/network/process/LIVE authority in historical replay harness.'
            exit 1
          fi
          grep -Fq 'canTrade:false' shadow-historical-replay-11-15.js
          grep -Fq 'canAuthorizeLive:false' shadow-historical-replay-11-15.js
          grep -Fq 'livePromotionAllowed:false' shadow-historical-replay-11-15.js
