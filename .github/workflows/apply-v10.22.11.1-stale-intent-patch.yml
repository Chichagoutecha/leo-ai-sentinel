name: Apply v10.22.11.1 stale intent patch

on:
  push:
    branches:
      - v10.22.11.1-stale-intent-context-hardening
    paths:
      - .github/workflows/apply-v10.22.11.1-stale-intent-patch.yml

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.22.11.1-stale-intent-context-hardening
          fetch-depth: 0

      - name: Apply exact stale-intent acknowledgement patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text()

          replacements = [
            (
              'const path = require("path");',
              'const path = require("path");\nconst { hasStrongExecutionBusinessAcknowledgement } = require("./execution-ack-policy");'
            ),
            (
              '  const responseAcknowledged = hasExecutionBusinessAcknowledgement(intent.response);',
              '  const responseAcknowledged = hasExecutionBusinessAcknowledgement(intent.response);\n  const strongResponseAcknowledged = hasStrongExecutionBusinessAcknowledgement(intent.response);'
            ),
            (
              '  const resolve = httpWas2xx && !responseAcknowledged && stateUnchanged && cashUnchanged &&',
              '  const resolve = httpWas2xx && !strongResponseAcknowledged && stateUnchanged && cashUnchanged &&'
            ),
            (
              '    reconciliations,\n    responseAcknowledged,\n    cashDeltaUsd:',
              '    reconciliations,\n    responseAcknowledged,\n    strongResponseAcknowledged,\n    cashDeltaUsd:'
            )
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'PATCH_GUARD_FAILED: expected exactly 1 occurrence, got {count}: {old[:100]}')
            s = s.replace(old, new, 1)

          if s.count('hasStrongExecutionBusinessAcknowledgement') != 3:
            raise SystemExit('PATCH_GUARD_FAILED: unexpected strong acknowledgement marker count')
          if s.count('https://public-api.etoro.com/api/v2/trading/execution/orders') != 1:
            raise SystemExit('PATCH_GUARD_FAILED: eToro v2 BUY endpoint count changed')
          if 'market-open-orders/by-amount' in s:
            raise SystemExit('PATCH_GUARD_FAILED: deprecated v1 BUY route reappeared')

          p.write_text(s)
          PY

      - name: Validate syntax and focused tests
        shell: bash
        run: |
          npm install
          node --check index.js
          node --check execution-ack-policy.js
          node --test test-execution-ack-policy.js
          npm test

      - name: Commit patched runtime and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git rm .github/workflows/apply-v10.22.11.1-stale-intent-patch.yml
          git commit -m "v10.22.11.1: resolve weak-ack stale intents safely"
          git push origin HEAD:v10.22.11.1-stale-intent-context-hardening
