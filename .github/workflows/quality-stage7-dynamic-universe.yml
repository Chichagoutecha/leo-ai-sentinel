name: Stage 7 Dynamic Universe Quality
on:
  pull_request:
    paths:
      - 'shadow-dynamic-universe-manager.js'
      - 'test-shadow-dynamic-universe-manager.js'
      - 'DYNAMIC_UNIVERSE_STAGE7.md'
      - '.github/workflows/quality-stage7-dynamic-universe.yml'
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --check shadow-dynamic-universe-manager.js && node --check test-shadow-dynamic-universe-manager.js
      - run: node --test test-shadow-dynamic-universe-manager.js
      - run: git diff --exit-code "origin/${{ github.base_ref }}...HEAD" -- index.js
      - run: |
          if grep -Eqi 'LIVE_EXECUTION_ARMED\s*=|trading/execution|new OpenAI|execute(Buy|Sell)\(' shadow-dynamic-universe-manager.js; then echo 'Unexpected LIVE coupling'; exit 1; fi
