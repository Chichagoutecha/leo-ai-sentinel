name: eToro v2 BUY Production Migration Draft Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run stacked v2 contract tests
        run: |
          node --check index.js
          node --check etoro-v2-buy-production-migration-draft.js
          node --check etoro-v2-buy-runtime-draft-audit.js
          node --test test-etoro-current-order-contract.js
          node --test test-etoro-v2-buy-integration-draft.js
          node --test test-etoro-v2-persistent-intent-shadow.js
      - name: Existing execution safety regressions
        run: |
          node --test test-etoro-execution-diagnostics-v10.22.10.js
          node --test test-etoro-execution-evidence-observer.js
      - name: Prove tracked index is exactly the candidate generated by v10.22.10.7
        shell: bash
        run: |
          git show a11df7f1978208715a1481f5a415e947d3404a92:index.js > /tmp/index-before-v2.js
          node etoro-v2-buy-runtime-draft-audit.js /tmp/index-before-v2.js index.js
      - name: Prove no production configuration or Render change
        shell: bash
        run: |
          git diff --exit-code a11df7f1978208715a1481f5a415e947d3404a92...HEAD -- package.json render.yaml render.yml ai-cost-optimizer.js ai-luna-temperature-compat.js ai-context-optimizer.js production-ai-preflight.js
      - name: Audit exact runtime diff shape
        shell: bash
        run: |
          NUMSTAT=$(git diff --numstat a11df7f1978208715a1481f5a415e947d3404a92...HEAD -- index.js)
          test "$NUMSTAT" = $'14\t2\tindex.js'
          test "$(grep -Fc 'https://public-api.etoro.com/api/v1/trading/execution/market-open-orders/by-amount' index.js || true)" -eq 0
          test "$(grep -Fc 'https://public-api.etoro.com/api/v2/trading/execution/orders' index.js || true)" -eq 1
          grep -Fq 'action: "open"' index.js
          grep -Fq 'transaction: "buy"' index.js
          grep -Fq 'orderType: "mkt"' index.js
          grep -Fq 'orderCurrency: "usd"' index.js
          grep -Fq 'token: first?.token' index.js
          grep -Fq 'referenceId: first?.referenceId' index.js
      - name: Prove one-shot execution and post-order verification survive applied transform
        shell: bash
        run: |
          grep -Fq '{ label: `eToro LIVE BUY ${asset}`, retries: 0 }' index.js
          grep -Fq 'createOrderIntent("BUY", asset, safeAmount, {' index.js
          grep -Fq 'updateOrderIntentStatus(intent.id, EXECUTION_STATUS.SENT, {' index.js
          grep -Fq 'verifyRealPortfolioBeforeExecution({ asset, side: "BUY", amount: safeAmount })' index.js
          grep -Fq 'verifyPortfolioAfterExecution({' index.js
          grep -Fq 'if (businessAcknowledged || verification.observed) setCooldown(asset);' index.js
