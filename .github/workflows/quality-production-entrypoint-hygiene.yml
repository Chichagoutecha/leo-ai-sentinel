name: Production Entrypoint Hygiene Quality

on:
  pull_request:
    paths:
      - 'package.json'
      - 'PRODUCTION_ENTRYPOINT_HYGIENE_V10.22.9.2.md'
      - '.github/workflows/quality-production-entrypoint-hygiene.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Luna compatibility unit tests
        run: npm test

      - name: Optimizer plus Luna preload regression
        run: npm run test:ai-preload

      - name: Prove default start preserves validated Render AI preload order
        run: |
          node - <<'NODE'
          const pkg=require('./package.json');
          const start=String(pkg.scripts.start||'');
          const optimizer='-r ./ai-cost-optimizer.js';
          const luna='-r ./ai-luna-temperature-compat.js';
          const preflight='-r ./production-ai-preflight.js';
          const index=start.lastIndexOf('index.js');
          if(!(start.indexOf(optimizer)>=0&&start.indexOf(optimizer)<start.indexOf(luna)&&start.indexOf(luna)<index))throw new Error(`Validated optimizer/Luna order lost: ${start}`);
          if(start.includes(preflight)&&!(start.indexOf(luna)<start.indexOf(preflight)&&start.indexOf(preflight)<index))throw new Error(`Production preflight order invalid: ${start}`);
          if(start.includes('etoro-execution-diagnostics.js'))throw new Error('Legacy eToro diagnostic must not be in default start command.');
          if(!pkg.scripts['test:ai-preload'])throw new Error('AI preload regression command missing.');
          console.log('Repository entrypoint preserves validated Render AI preload order.');
          NODE

      - name: Prove production code and active preloads are untouched
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --exit-code "origin/${{ github.base_ref }}...HEAD" -- index.js ai-cost-optimizer.js ai-luna-temperature-compat.js etoro-execution-diagnostics.js
