name: eToro v2 Buy Integration Draft Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and draft integration tests
        run: |
          node --check etoro-current-order-contract.js
          node --check etoro-v2-buy-integration-draft.js
          node --check test-etoro-v2-buy-integration-draft.js
          node --test test-etoro-current-order-contract.js
          node --test test-etoro-v2-buy-integration-draft.js
      - name: Existing execution safety regressions
        run: |
          node --test test-etoro-execution-diagnostics-v10.22.10.js
          node --test test-etoro-execution-evidence-observer.js
      - name: Prove exact validated runtime migration and no Render/config drift
        shell: bash
        run: |
          git show a11df7f1978208715a1481f5a415e947d3404a92:index.js > /tmp/index-before-v2.js
          node etoro-v2-buy-runtime-draft-audit.js /tmp/index-before-v2.js index.js
          git diff --exit-code a11df7f1978208715a1481f5a415e947d3404a92...HEAD -- package.json render.yaml render.yml
      - name: Prove integration helper retains no default network or dual-submit authority
        shell: bash
        run: |
          if grep -Eqi 'global\.fetch\s*\(|fetch\s*\(' etoro-v2-buy-integration-draft.js; then
            echo 'Unexpected default network transport in draft integration.'
            exit 1
          fi
          grep -Fq 'defaultNetworkTransport: false' etoro-v2-buy-integration-draft.js
          grep -Fq 'liveAuthority: false' etoro-v2-buy-integration-draft.js
          grep -Fq 'productionRoutingChanged: false' etoro-v2-buy-integration-draft.js
          grep -Fq 'automaticRetry: false' etoro-v2-buy-integration-draft.js
          grep -Fq 'dualSubmitFallback: false' etoro-v2-buy-integration-draft.js
      - name: Prove runtime remains one-shot after connection
        shell: bash
        run: |
          grep -Fq '{ label: `eToro LIVE BUY ${asset}`, retries: 0 }' index.js
          grep -Fq 'verifyPortfolioAfterExecution({' index.js
          test "$(grep -Fc 'https://public-api.etoro.com/api/v2/trading/execution/orders' index.js || true)" -eq 1
