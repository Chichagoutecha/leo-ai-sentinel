name: Stage 15 Institutional Risk Quality
on:
  pull_request:
    paths:
      - 'shadow-institutional-risk-engine.js'
      - 'test-shadow-institutional-risk-engine.js'
      - 'INSTITUTIONAL_RISK_ENGINE_STAGE15.md'
      - '.github/workflows/quality-stage15-institutional-risk.yml'
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --check shadow-institutional-risk-engine.js && node --check test-shadow-institutional-risk-engine.js
      - run: node --test test-shadow-institutional-risk-engine.js
      - run: git diff --exit-code "origin/${{ github.base_ref }}...HEAD" -- index.js
      - run: |
          if grep -Eqi 'trading/execution|LIVE_EXECUTION_ARMED\s*=|new OpenAI|execute(Buy|Sell)\(' shadow-institutional-risk-engine.js; then
            echo 'Unexpected LIVE/OpenAI/execution coupling'; exit 1; fi
