name: eToro Current v2 Order Contract Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and contract tests
        run: |
          node --check etoro-current-order-contract.js
          node --check test-etoro-current-order-contract.js
          node --test test-etoro-current-order-contract.js
      - name: Existing execution safety regressions
        run: |
          node --test test-etoro-execution-diagnostics-v10.22.10.js
          node --test test-etoro-execution-evidence-observer.js
      - name: Prove runtime is the exact validated v2 BUY migration
        shell: bash
        run: |
          git show a11df7f1978208715a1481f5a415e947d3404a92:index.js > /tmp/index-before-v2.js
          node etoro-v2-buy-runtime-draft-audit.js /tmp/index-before-v2.js index.js
          git diff --exit-code a11df7f1978208715a1481f5a415e947d3404a92...HEAD -- package.json ai-cost-optimizer.js ai-luna-temperature-compat.js ai-context-optimizer.js production-ai-preflight.js render.yaml render.yml
      - name: Prove contract helper itself has no network or LIVE authority
        shell: bash
        run: |
          if grep -Eqi 'global\.fetch\s*\(|fetch\s*\(|LIVE_EXECUTION_ARMED\s*=|executeBuy\s*\(|executeSell\s*\(' etoro-current-order-contract.js; then
            echo 'Unexpected provider call or LIVE authority in v2 contract audit.'
            exit 1
          fi
          grep -Fq 'canTrade:false' etoro-current-order-contract.js
          grep -Fq 'canAuthorizeLive:false' etoro-current-order-contract.js
          grep -Fq 'livePromotionAllowed:false' etoro-current-order-contract.js
      - name: Prove one-shot runtime without dual-submit fallback
        shell: bash
        run: |
          grep -Fq '{ label: `eToro LIVE BUY ${asset}`, retries: 0 }' index.js
          test "$(grep -Fc 'https://public-api.etoro.com/api/v2/trading/execution/orders' index.js || true)" -eq 1
          test "$(grep -Fc 'https://public-api.etoro.com/api/v1/trading/execution/market-open-orders/by-amount' index.js || true)" -eq 0
