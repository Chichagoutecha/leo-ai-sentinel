name: Stage 11 Market Regime Engine 2 Quality
on:
  pull_request:
    paths:
      - 'shadow-market-regime-engine-v2.js'
      - 'test-shadow-market-regime-engine-v2.js'
      - 'MARKET_REGIME_ENGINE_STAGE11.md'
      - '.github/workflows/quality-stage11-regime-v2.yml'
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --check shadow-market-regime-engine-v2.js && node --check test-shadow-market-regime-engine-v2.js
      - run: node --test test-shadow-market-regime-engine-v2.js
      - run: git diff --exit-code "origin/${{ github.base_ref }}...HEAD" -- index.js
      - run: |
          if grep -Eqi 'trading/execution|LIVE_EXECUTION_ARMED\s*=|new OpenAI|execute(Buy|Sell)\(' shadow-market-regime-engine-v2.js; then
            echo 'Unexpected LIVE/OpenAI/execution coupling'; exit 1; fi
