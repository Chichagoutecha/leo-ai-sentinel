name: LEO Production Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.js'
      - 'package.json'
      - 'ai-cost-optimizer.js'
      - 'ai-luna-temperature-compat.js'
      - 'ai-context-optimizer.js'
      - 'ai-context-optimizer-v2.js'
      - 'execution-aware-decision-runtime.js'
      - 'production-ai-preflight.js'
      - 'etoro-execution-diagnostics.js'
      - 'etoro-agent-scope-compat.js'
      - 'execution-quality-shadow-agent.js'
      - 'etoro-acknowledged-no-effect-hotfix.js'
      - 'etoro-ucits-execution-bridge.js'
      - 'all-in-cost-shadow-agent.js'
      - 'hold-opportunity-shadow-agent.js'
      - 'test-etoro-execution-diagnostics.js'
      - 'test-etoro-agent-scope-compat.js'
      - 'test-etoro-acknowledged-no-effect-hotfix.js'
      - 'test-etoro-ucits-execution-bridge.js'
      - 'test-all-in-cost-shadow-agent.js'
      - 'test-hold-opportunity-shadow-agent.js'
      - 'test-ai-context-optimizer.js'
      - 'test-ai-context-adaptive.js'
      - 'test-ai-context-v2.js'
      - 'test-execution-aware-decision-runtime.js'
      - 'test-lot-aware-risk-sizing.js'
      - 'test-real-sell-proof.js'
      - 'test-execution-quality-shadow-agent.js'
      - 'test-ai-context-preload-integration.js'
      - 'test-ai-cost-concurrency-reservation.js'
      - 'test-ai-cost-missing-usage.js'
      - 'test-ai-cost-secret-redaction.js'
      - 'test-production-ai-preflight.js'
      - '.github/workflows/quality-clean-etoro-v2-production-rc.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prove change surface is intentionally narrow
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main...HEAD -- ai-cost-optimizer.js ai-luna-temperature-compat.js production-ai-preflight.js
          allowed='^(index\.js|ai-context-optimizer\.js|ai-context-optimizer-v2\.js|execution-aware-decision-runtime\.js|package\.json|etoro-execution-diagnostics\.js|etoro-agent-scope-compat\.js|etoro-acknowledged-no-effect-hotfix\.js|etoro-ucits-execution-bridge\.js|all-in-cost-shadow-agent\.js|hold-opportunity-shadow-agent\.js|test-etoro-execution-diagnostics\.js|test-etoro-agent-scope-compat\.js|test-etoro-acknowledged-no-effect-hotfix\.js|test-etoro-ucits-execution-bridge\.js|test-all-in-cost-shadow-agent\.js|test-hold-opportunity-shadow-agent\.js|test-ai-context-adaptive\.js|test-ai-context-v2\.js|test-execution-aware-decision-runtime\.js|test-lot-aware-risk-sizing\.js|test-real-sell-proof\.js|execution-quality-shadow-agent\.js|test-execution-quality-shadow-agent\.js|\.github/workflows/quality-clean-etoro-v2-production-rc\.yml)$'
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
          test ! -e .github/workflows/apply-v10.22.11.1-stale-intent-patch.yml

      - name: Prove index execution, risk and SELL-proof invariants
        shell: bash
        run: |
          git fetch origin main --depth=1
          grep -Fq 'const VERSION = "v10.22.23-execution-proof-integrity";' index.js
          grep -Fq 'const UCITS_OVERLAP_SCAN_SCHEDULE =' index.js
          grep -Fq 'process.env.UCITS_OVERLAP_SCAN_SCHEDULE || "45 14 * * 1-5"' index.js
          grep -Fq 'SCAN UCITS OVERLAP START:' index.js
          grep -Fq 'scanMarket("auto-trade-ucits-overlap")' index.js
          test "$(grep -Fc 'https://public-api.etoro.com/api/v2/trading/execution/orders' index.js)" -eq 1
          test "$(grep -Fc 'const MAX_EXECUTED_ORDERS_24H = 4;' index.js)" -eq 1
          test "$(grep -Fc 'const MAX_BUYS_24H = 3;' index.js)" -eq 1
          test "$(grep -Fc 'const MAX_SELLS_24H = 2;' index.js)" -eq 1
          test "$(grep -Fc 'const MIN_HOURS_BETWEEN_EXECUTIONS = 2;' index.js)" -eq 1
          test "$(grep -Fc 'const COUNCIL_REQUIRE_NO_HARD_VETO =' index.js)" -eq 1
          grep -Fq 'const LOT_AWARE_RISK_SIZING_ENABLED =' index.js
          grep -Fq 'const LOT_AWARE_MAX_TARGET_OVERSHOOT_PCT =' index.js
          grep -Fq 'function buildLotAwareBuyCapacity' index.js
          grep -Fq 'status = "MINIMUM_LOT_ALLOWED"' index.js
          grep -Fq 'canExceedHardCaps: false' index.js
          grep -Fq 'canOverrideHardVeto: false' index.js
          test "$(grep -Fc 'https://public-api.etoro.com/api/v2/trading/execution/orders' index.js)" -eq 1
          npm run test:lot-aware

      - name: Syntax checks
        run: npm run check

      - name: Production AI tests
        run: npm test

      - name: Production preload integration tests
        run: |
          npm run test:ai-preload
          npm run test:ai-context-preload
          npm run test:production-preflight
          npm run test:ai-cost-concurrency
          npm run test:ai-cost-missing-usage

      - name: Prove adaptive context safety contract
        shell: bash
        run: |
          grep -Fq "v10.22.11.1-ai-context-adaptive" ai-context-optimizer.js
          grep -Fq "sameSafetyFacts(original, candidate)" ai-context-optimizer.js
          grep -Fq "SAFE_COMPACTION_ABOVE_LIMIT" ai-context-optimizer.js
          grep -Fq "strategyModified: false" ai-context-optimizer.js
          grep -Fq "sizingModified: false" ai-context-optimizer.js
          grep -Fq "etoroModified: false" ai-context-optimizer.js
          grep -Fq "liveExecutionArmedModified: false" ai-context-optimizer.js
          node --test test-ai-context-adaptive.js

      - name: Prove context v2 and execution-aware governance
        shell: bash
        run: |
          grep -Fq "v10.22.18.0-ai-context-v2" ai-context-optimizer-v2.js
          grep -Fq "attachMissingSafetyManifest" ai-context-optimizer-v2.js
          grep -Fq "manifestSafetyCheck(payload, candidate)" ai-context-optimizer-v2.js
          grep -Fq "__leo_safety_manifest" ai-context-optimizer-v2.js
          grep -Fq "failClosedAboveCeiling: true" ai-context-optimizer-v2.js
          grep -Fq "strategyModified: false" ai-context-optimizer-v2.js
          grep -Fq "sizingModified: false" ai-context-optimizer-v2.js
          grep -Fq "etoroModified: false" ai-context-optimizer-v2.js
          grep -Fq "v10.22.17.0-execution-aware-decision" execution-aware-decision-runtime.js
          grep -Fq "canPlaceOrder: false" execution-aware-decision-runtime.js
          grep -Fq "canModifyOrder: false" execution-aware-decision-runtime.js
          grep -Fq "canOverrideHardVeto: false" execution-aware-decision-runtime.js
          grep -Fq "providerCallsAdded: 0" execution-aware-decision-runtime.js
          grep -Fq "10 */2 * * *" execution-aware-decision-runtime.js
          grep -Fq "45 14 * * 1-5" execution-aware-decision-runtime.js
          grep -Fq "decision?.action || decision?.decision || 'UNKNOWN'" execution-aware-decision-runtime.js
          node --test test-ai-context-v2.js test-execution-aware-decision-runtime.js

      - name: Prove exact eToro v2 BUY runtime remains unchanged
        shell: bash
        run: |
          test "$(grep -Fc 'https://public-api.etoro.com/api/v2/trading/execution/orders' index.js)" -eq 1
          test "$(grep -Fc 'https://public-api.etoro.com/api/v1/trading/execution/market-open-orders/by-amount' index.js)" -eq 0
          grep -Fq 'action: "open"' index.js
          grep -Fq 'transaction: "buy"' index.js
          grep -Fq 'orderType: "mkt"' index.js
          grep -Fq 'orderCurrency: "usd"' index.js
          grep -Fq 'retries: 0' index.js
          grep -Fq 'createOrderIntent("BUY", asset, safeAmount, {' index.js
          grep -Fq 'verifyRealPortfolioBeforeExecution({ asset, side: "BUY", amount: safeAmount })' index.js
          grep -Fq 'verifyPortfolioAfterExecution({' index.js
          grep -Fq 'const LIVE_EXECUTION_ARMED = process.env.LIVE_EXECUTION_ARMED === "true";' index.js
          grep -Fq 'token:' index.js
          grep -Fq 'referenceId:' index.js

      - name: Prove exact REAL SELL close-position contract
        shell: bash
        run: |
          test "$(grep -Fc 'https://public-api.etoro.com/api/v1/trading/execution/market-close-orders/positions/' index.js)" -eq 1
          grep -Fq 'body: JSON.stringify({ UnitsToDeduct: null })' index.js
          grep -Fq 'createOrderIntent("SELL", asset, 0, {' index.js
          grep -Fq 'const SELL_CLOSE_PROOF_VERSION = "v10.22.20.0-real-sell-proof";' index.js
          grep -Fq 'const SELL_CLOSE_PROOF_REQUIRE_TARGET_POSITION_ID = true;' index.js
          grep -Fq 'function buildSellCloseProof' index.js
          grep -Fq '"TARGET_POSITION_REMOVED"' index.js
          grep -Fq '"EXACT_POSITION_ID_CLOSE_PROOF"' index.js
          grep -Fq 'closeDescriptorIsProof: false' index.js
          grep -Fq 'cashDeltaIsProof: false' index.js
          grep -Fq 'expectedPositionId: positionId' index.js
          grep -Fq 'confirmationRequiresExactTargetPositionRemoval: true' index.js
          grep -Fq 'app.get("/sell-proof-status"' index.js
          if grep -Fq '"CLOSE_ORDER_VISIBLE"' index.js; then
            echo "ordersForClose descriptor must not be treated as SELL execution proof"
            exit 1
          fi
          npm run test:real-sell-proof

      - name: Prove Execution Quality shadow is non-interfering and estimate-only
        shell: bash
        run: |
          grep -Fq "v10.22.23.0-execution-proof-integrity" execution-quality-shadow-agent.js
          grep -Fq "if (!pnlSnapshot.valid) return 0" execution-quality-shadow-agent.js
          grep -Fq "observation.confirmation?.proof === 'BROKER_POSITION_ID_VISIBLE_IN_REAL_PNL'" execution-quality-shadow-agent.js
          grep -Fq "observationReadiness: observationReadiness()" execution-quality-shadow-agent.js
          grep -Fq "canPlaceOrder: false" execution-quality-shadow-agent.js
          grep -Fq "canBlockOrder: false" execution-quality-shadow-agent.js
          grep -Fq "canModifyOrder: false" execution-quality-shadow-agent.js
          grep -Fq "canModifySizing: false" execution-quality-shadow-agent.js
          grep -Fq "canChangeMinimumOrder: false" execution-quality-shadow-agent.js
          grep -Fq "canRetryOrder: false" execution-quality-shadow-agent.js
          grep -Fq "providerCallsAdded: 0" execution-quality-shadow-agent.js
          grep -Fq "brokerReadCallsAdded: 0" execution-quality-shadow-agent.js
          grep -Fq "orderCallsAdded: 0" execution-quality-shadow-agent.js
          grep -Fq "copyCalibrationAutoApply: false" execution-quality-shadow-agent.js
          grep -Fq "directCopierObservationAvailable: false" execution-quality-shadow-agent.js
          grep -Fq "eligibleForAutomaticSizingChange: false" execution-quality-shadow-agent.js
          grep -Fq "READY_FOR_HUMAN_REVIEW_ESTIMATE_ONLY" execution-quality-shadow-agent.js
          grep -Fq 'app.get("/execution-quality-status", requireSecret' index.js
          grep -Fq 'app.get("/execution-quality-history", requireSecret' index.js
          grep -Fq 'app.get("/copy-calibration-status", requireSecret' index.js
          npm run test:execution-quality

      - name: Prove eToro scope guard is fail-closed in armed LIVE
        shell: bash
        run: |
          grep -Fq "MODERN_REAL_READ_ID = 211" etoro-agent-scope-compat.js
          grep -Fq "MODERN_REAL_WRITE_ID = 212" etoro-agent-scope-compat.js
          grep -Fq "ETORO_EXPECTED_USER_TOKEN_ID" etoro-agent-scope-compat.js
          grep -Fq "EXPECTED_TOKEN_ID_REQUIRED" etoro-agent-scope-compat.js
          npm run test:etoro-scopes

      - name: Prove acknowledged and UCITS pre-send no-effect guards are conservative
        shell: bash
        run: |
          grep -Fq "v10.22.14.0-etoro-no-effect-hotfix" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "DEFAULT_ACK_TIMEOUT_MINUTES = 180" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "DEFAULT_ACK_MIN_RECONCILIATIONS = 12" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "UCITS_PRE_SEND_REJECTION_NO_BROKER_ORDER" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "PRE_SEND_REJECTED_NOT_SENT_TO_ETORO" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "sentToEtoro: false" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "requiresNoPositionId: true" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "requiresStateUnchanged: true" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "requiresCashUnchanged: true" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "sendsOrders: false" etoro-acknowledged-no-effect-hotfix.js
          grep -Fq "liveExecutionArmedModified: false" etoro-acknowledged-no-effect-hotfix.js
          npm run test:etoro-no-effect

      - name: Prove UCITS execution bridge is fail-closed and analysis-preserving
        shell: bash
        run: |
          grep -Fq "const mode = String(value || 'guard')" etoro-ucits-execution-bridge.js
          grep -Fq "UCITS_EXECUTION_GUARD_ACTIVE" etoro-ucits-execution-bridge.js
          grep -Fq "UCITS_SYMBOL_NOT_APPROVED" etoro-ucits-execution-bridge.js
          grep -Fq "UCITS_SYMBOL_EXACT_MATCH_REQUIRED" etoro-ucits-execution-bridge.js
          grep -Fq "UCITS_EXECUTION_VENUE_CLOSED" etoro-ucits-execution-bridge.js
          grep -Fq "UCITS_QUOTE_STALE" etoro-ucits-execution-bridge.js
          grep -Fq "originatesOrders: false" etoro-ucits-execution-bridge.js
          grep -Fq "SPY: Object.freeze({ analysisInstrumentId: 3417, executionSymbol: 'CSPX.L'" etoro-ucits-execution-bridge.js
          grep -Fq "QQQ: Object.freeze({ analysisInstrumentId: 3418, executionSymbol: 'CNDX.L'" etoro-ucits-execution-bridge.js
          grep -Fq "GLD: Object.freeze({ analysisInstrumentId: 15634, executionSymbol: 'IGLN.L'" etoro-ucits-execution-bridge.js
          npm run test:etoro-ucits

      - name: Prove All-In Cost agent is shadow-only and non-interfering
        shell: bash
        run: |
          grep -Fq "v10.22.13.0-all-in-cost-shadow" all-in-cost-shadow-agent.js
          grep -Fq "shadowOnly: true" all-in-cost-shadow-agent.js
          grep -Fq "canPlaceOrder: false" all-in-cost-shadow-agent.js
          grep -Fq "canBlockOrder: false" all-in-cost-shadow-agent.js
          grep -Fq "canModifyOrder: false" all-in-cost-shadow-agent.js
          grep -Fq "canModifyDecision: false" all-in-cost-shadow-agent.js
          grep -Fq "canModifySizing: false" all-in-cost-shadow-agent.js
          grep -Fq "originatesOrders: false" all-in-cost-shadow-agent.js
          grep -Fq "not delayed waiting for shadow calculations" all-in-cost-shadow-agent.js
          grep -Fq "/cost-shadow-status" all-in-cost-shadow-agent.js
          grep -Fq "/cost-shadow-history" all-in-cost-shadow-agent.js
          grep -Fq "/cost-shadow-calibration" all-in-cost-shadow-agent.js
          npm run test:cost-shadow

      - name: Prove HOLD Opportunity agent is shadow-only and non-interfering
        shell: bash
        run: |
          grep -Fq "v10.22.17.0-hold-opportunity-shadow" hold-opportunity-shadow-agent.js
          grep -Fq "shadowOnly: true" hold-opportunity-shadow-agent.js
          grep -Fq "canPlaceOrder: false" hold-opportunity-shadow-agent.js
          grep -Fq "canBlockOrder: false" hold-opportunity-shadow-agent.js
          grep -Fq "canModifyOrder: false" hold-opportunity-shadow-agent.js
          grep -Fq "canModifyDecision: false" hold-opportunity-shadow-agent.js
          grep -Fq "canModifySizing: false" hold-opportunity-shadow-agent.js
          grep -Fq "canModifyCouncilVote: false" hold-opportunity-shadow-agent.js
          grep -Fq "canChangeRiskThresholds: false" hold-opportunity-shadow-agent.js
          grep -Fq "canChangeSchedule: false" hold-opportunity-shadow-agent.js
          grep -Fq "providerCallsAdded: 0" hold-opportunity-shadow-agent.js
          grep -Fq "originatesOrders: false" hold-opportunity-shadow-agent.js
          grep -Fq "decision?.action || decision?.decision || 'UNKNOWN'" hold-opportunity-shadow-agent.js
          grep -Fq "/hold-shadow-status" hold-opportunity-shadow-agent.js
          grep -Fq "/hold-shadow-history" hold-opportunity-shadow-agent.js
          grep -Fq "/hold-shadow-calibration" hold-opportunity-shadow-agent.js
          npm run test:hold-shadow

      - name: Prove canonical production start command
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const expected='node -r ./ai-cost-optimizer.js -r ./ai-luna-temperature-compat.js -r ./ai-context-optimizer.js -r ./ai-context-optimizer-v2.js -r ./execution-aware-decision-runtime.js -r ./production-ai-preflight.js -r ./etoro-execution-diagnostics.js -r ./etoro-agent-scope-compat.js -r ./execution-quality-shadow-agent.js -r ./etoro-ucits-execution-bridge.js -r ./etoro-acknowledged-no-effect-hotfix.js -r ./all-in-cost-shadow-agent.js -r ./hold-opportunity-shadow-agent.js index.js'; if(p.scripts.start!==expected){console.error(p.scripts.start);process.exit(1)}"
