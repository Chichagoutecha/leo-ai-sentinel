name: Apply eToro v2 BUY Runtime Draft

on:
  push:
    branches:
      - v10.22.10.8-v2-buy-runtime-draft

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v10.22.10.8-v2-buy-runtime-draft
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert exact isolated branch and pre-migration state
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v10.22.10.8-v2-buy-runtime-draft"
          test "$(grep -Fc 'https://public-api.etoro.com/api/v1/trading/execution/market-open-orders/by-amount' index.js || true)" -eq 1
          test "$(grep -Fc 'https://public-api.etoro.com/api/v2/trading/execution/orders' index.js || true)" -eq 0
          git diff --exit-code
      - name: Generate exact candidate from validated transformer
        run: |
          node etoro-v2-buy-production-migration-draft.js index.js /tmp/index-v2-runtime-draft.js
          node --check /tmp/index-v2-runtime-draft.js
      - name: Audit candidate before applying
        shell: bash
        run: |
          diff -u index.js /tmp/index-v2-runtime-draft.js > /tmp/runtime.diff || true
          test -s /tmp/runtime.diff
          HUNKS=$(grep -c '^@@ ' /tmp/runtime.diff || true)
          test "$HUNKS" -ge 2
          test "$HUNKS" -le 3
          test "$(grep -Fc 'https://public-api.etoro.com/api/v1/trading/execution/market-open-orders/by-amount' /tmp/index-v2-runtime-draft.js || true)" -eq 0
          test "$(grep -Fc 'https://public-api.etoro.com/api/v2/trading/execution/orders' /tmp/index-v2-runtime-draft.js || true)" -eq 1
          grep -Fq 'token: first?.token' /tmp/index-v2-runtime-draft.js
          grep -Fq 'referenceId: first?.referenceId' /tmp/index-v2-runtime-draft.js
          grep -Fq '{ label: `eToro LIVE BUY ${asset}`, retries: 0 }' /tmp/index-v2-runtime-draft.js
          grep -Fq 'verifyPortfolioAfterExecution({' /tmp/index-v2-runtime-draft.js
      - name: Apply candidate to tracked runtime only
        shell: bash
        run: |
          cp /tmp/index-v2-runtime-draft.js index.js
          node --check index.js
          CHANGED=$(git diff --name-only)
          test "$CHANGED" = "index.js"
      - name: Commit exact runtime draft
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js
          git commit -m 'apply exact eToro v2 BUY runtime draft'
          git push origin HEAD:v10.22.10.8-v2-buy-runtime-draft
